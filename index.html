<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cats</title>
    <meta name="theme-color" content="#4a90d9">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px;
            position: relative;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .pull-indicator {
            position: absolute;
            top: -50px;
            left: 0;
            right: 0;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
            transition: top 0.3s ease;
            z-index: 10;
        }
        .pull-indicator.visible {
            top: 0;
        }
        .pull-indicator.spinner::after {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid #4a90d9;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .header {
            text-align: center;
            padding-top: 20px;
        }
        .status-badge {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        .status-badge.inactive {
            background: #fee8e8;
            color: #d94a4a;
        }
        .event-title {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            line-height: 1.3;
        }
        .timer-section {
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .timer-display {
            font-size: 72px;
            font-weight: 800;
            color: #4a90d9;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            letter-spacing: -2px;
        }
        .timer-display.negative {
            color: #d94a4a;
        }
        .timer-label {
            font-size: 14px;
            color: #888;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .loading {
            font-size: 18px;
            color: #888;
        }
        .error {
            font-size: 16px;
            color: #d94a4a;
            padding: 0 20px;
        }
        .extend-section {
            padding-bottom: 20px;
        }
        .extend-label {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            text-align: center;
            margin-bottom: 16px;
        }
        .extend-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .extend-btn {
            flex: 1;
            padding: 18px 8px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            background: #fff;
            font-size: 18px;
            font-weight: 700;
            color: #333;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }
        .extend-btn:active {
            transform: scale(0.96);
        }
        .extend-btn.selected {
            border-color: #4a90d9;
            background: #e8f0fe;
            color: #4a90d9;
        }
        .extend-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .extend-btn .sub {
            font-size: 11px;
            font-weight: 400;
            color: #888;
            margin-top: 4px;
        }
        .ok-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 14px;
            background: #4a90d9;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            opacity: 0.4;
            pointer-events: none;
        }
        .ok-btn.active {
            opacity: 1;
            pointer-events: auto;
        }
        .ok-btn:active {
            transform: scale(0.98);
        }
        .ok-btn:disabled {
            background: #ccc;
        }
        .reset-btn {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 14px;
            background: #fff;
            color: #888;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            margin-top: 12px;
        }
        .reset-btn:active {
            transform: scale(0.98);
            background: #f5f5f5;
        }
        .reset-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .confirm-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 100;
        }
        .confirm-overlay.show {
            display: flex;
        }
        .confirm-dialog {
            background: white;
            border-radius: 20px;
            padding: 32px 24px;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }
        .confirm-dialog .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .confirm-dialog h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #333;
        }
        .confirm-dialog p {
            font-size: 15px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .confirm-dialog .btn-group {
            display: flex;
            gap: 12px;
        }
        .confirm-dialog button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cancel {
            background: #f0f0f0;
            color: #666;
        }
        .btn-confirm {
            background: #4a90d9;
            color: white;
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="pull-indicator" id="pullIndicator">
            ↓ Ziehen zum Aktualisieren
        </div>

        <div class="header">
            <div class="status-badge" id="statusBadge">Laden...</div>
            <div class="event-title">Cats</div>
        </div>

        <div class="timer-section" id="timerSection">
            <div class="loading" id="timerDisplay">Lade...</div>
            <div class="timer-label" id="timerLabel">verbleibend</div>
        </div>

        <div class="extend-section">
            <div class="extend-label">Zeit verlängern</div>
            <div class="extend-buttons">
                <button class="extend-btn" data-hours="4" onclick="selectExtend(this, 4)" id="btn4h">
                    +4h
                    <div class="sub">Kurz</div>
                </button>
                <button class="extend-btn" data-hours="8" onclick="selectExtend(this, 8)" id="btn8h">
                    +8h
                    <div class="sub">Mittel</div>
                </button>
                <button class="extend-btn" data-hours="12" onclick="selectExtend(this, 12)" id="btn12h">
                    +12h
                    <div class="sub">Lang</div>
                </button>
            </div>
            <button class="ok-btn" id="okBtn" onclick="showConfirm()">
                OK
            </button>
            <button class="reset-btn" id="resetBtn" onclick="showResetConfirm()">
                ↺ Reset auf 8 Stunden
            </button>
        </div>

        <div class="confirm-overlay" id="confirmOverlay">
            <div class="confirm-dialog">
                <div class="icon">⏱️</div>
                <h3>Zeit verlängern?</h3>
                <p id="confirmText">Countdown um 4 Stunden verlängern?</p>
                <div class="btn-group">
                    <button class="btn-cancel" onclick="hideConfirm()">Abbrechen</button>
                    <button class="btn-confirm" onclick="confirmExtend()">Verlängern</button>
                </div>
            </div>
        </div>

        <div class="confirm-overlay" id="resetOverlay">
            <div class="confirm-dialog">
                <div class="icon">↺</div>
                <h3>Reset?</h3>
                <p>Countdown auf 8 Stunden zurücksetzen?</p>
                <div class="btn-group">
                    <button class="btn-cancel" onclick="hideResetConfirm()">Abbrechen</button>
                    <button class="btn-confirm" onclick="confirmReset()">Zurücksetzen</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://9rgtwojmy1.execute-api.eu-central-1.amazonaws.com/prod';

        let endTime = null;
        let selectedHours = 0;
        let timerInterval = null;
        let isLoading = false;

        // Pull-to-Refresh
        let touchStartY = 0;
        let touchCurrentY = 0;
        let isPulling = false;
        const pullThreshold = 80;
        const container = document.getElementById('appContainer');
        const pullIndicator = document.getElementById('pullIndicator');

        container.addEventListener('touchstart', (e) => {
            if (container.scrollTop === 0) {
                touchStartY = e.touches[0].clientY;
                isPulling = true;
            }
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (!isPulling) return;
            touchCurrentY = e.touches[0].clientY;
            const diff = touchCurrentY - touchStartY;

            if (diff > 0 && diff < pullThreshold) {
                pullIndicator.style.top = `${-50 + diff}px`;
                pullIndicator.classList.add('visible');
            } else if (diff >= pullThreshold) {
                pullIndicator.textContent = 'Loslassen zum Aktualisieren';
            }
        }, { passive: true });

        container.addEventListener('touchend', () => {
            if (!isPulling) return;
            const diff = touchCurrentY - touchStartY;

            if (diff >= pullThreshold) {
                pullIndicator.textContent = '';
                pullIndicator.classList.add('spinner');
                loadTime().then(() => {
                    pullIndicator.classList.remove('spinner', 'visible');
                    pullIndicator.style.top = '-50px';
                    pullIndicator.textContent = '↓ Ziehen zum Aktualisieren';
                });
            } else {
                pullIndicator.classList.remove('visible');
                pullIndicator.style.top = '-50px';
            }
            isPulling = false;
            touchStartY = 0;
            touchCurrentY = 0;
        });

        async function loadTime() {
            setLoading(true);
            try {
                const response = await fetch(`${API_URL}/time`);
                const data = await response.json();

                if (data.active && data.endTime > 0) {
                    endTime = data.endTime;
                    startTimer();
                    updateStatus(true);
                } else {
                    endTime = data.endTime || null;
                    startTimer();
                    updateStatus(false);
                }
            } catch (error) {
                console.error('Fehler beim Laden:', error);
                showError('Verbindung fehlgeschlagen');
            } finally {
                setLoading(false);
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            if (!endTime) {
                showNoActiveEvent();
                return;
            }

            const now = Date.now();
            const diff = endTime - now;
            const absDiff = Math.abs(diff);

            const h = Math.floor(absDiff / 3600000);
            const m = Math.floor((absDiff % 3600000) / 60000);
            const s = Math.floor((absDiff % 60000) / 1000);

            const timerDisplay = document.getElementById('timerDisplay');
            timerDisplay.textContent = 
                `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

            if (diff <= 0) {
                timerDisplay.classList.add('negative');
                document.getElementById('timerLabel').textContent = 'abgelaufen';
            } else {
                timerDisplay.classList.remove('negative');
                document.getElementById('timerLabel').textContent = 'verbleibend';
            }

            timerDisplay.className = diff <= 0 ? 'timer-display negative' : 'timer-display';
        }

        function updateStatus(active) {
            const badge = document.getElementById('statusBadge');
            if (active) {
                badge.textContent = 'Aktiv';
                badge.className = 'status-badge';
            } else {
                badge.textContent = 'Inaktiv';
                badge.className = 'status-badge inactive';
            }
        }

        function showNoActiveEvent() {
            document.getElementById('timerDisplay').textContent = '--:--:--';
            document.getElementById('timerDisplay').className = 'timer-display';
            document.getElementById('timerLabel').textContent = 'verbleibend';
        }

        function showError(msg) {
            document.getElementById('timerDisplay').textContent = msg;
            document.getElementById('timerDisplay').className = 'error';
        }

        function setLoading(loading) {
            isLoading = loading;
            const buttons = document.querySelectorAll('.extend-btn, .ok-btn, .reset-btn');
            buttons.forEach(btn => btn.disabled = loading);

            if (loading) {
                document.getElementById('timerDisplay').textContent = 'Lade...';
                document.getElementById('timerDisplay').className = 'loading';
            }
        }

        async function extendTime(hours) {
            setLoading(true);
            try {
                const response = await fetch(`${API_URL}/time/extend`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hours: hours })
                });

                const data = await response.json();

                if (data.endTime) {
                    endTime = data.endTime;
                    startTimer();
                    updateStatus(true);
                }
            } catch (error) {
                console.error('Fehler beim Verlaengern:', error);
                showError('Verlaengern fehlgeschlagen');
            } finally {
                setLoading(false);
            }
        }

        async function resetTime(hours) {
            setLoading(true);
            try {
                const response = await fetch(`${API_URL}/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hours: hours })
                });

                const data = await response.json();

                if (data.endTime) {
                    endTime = data.endTime;
                    startTimer();
                    updateStatus(true);
                }
            } catch (error) {
                console.error('Fehler beim Reset:', error);
                showError('Reset fehlgeschlagen');
            } finally {
                setLoading(false);
            }
        }

        function selectExtend(btn, hours) {
            document.querySelectorAll('.extend-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedHours = hours;

            const okBtn = document.getElementById('okBtn');
            okBtn.classList.add('active');
        }

        function showConfirm() {
            if (selectedHours === 0 || isLoading) return;
            document.getElementById('confirmText').textContent =
                `Countdown um ${selectedHours} Stunden verlängern?`;
            document.getElementById('confirmOverlay').classList.add('show');
        }

        function hideConfirm() {
            document.getElementById('confirmOverlay').classList.remove('show');
        }

        async function confirmExtend() {
            await extendTime(selectedHours);

            document.querySelectorAll('.extend-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('okBtn').classList.remove('active');
            selectedHours = 0;
            hideConfirm();
        }

        function showResetConfirm() {
            if (isLoading) return;
            document.getElementById('resetOverlay').classList.add('show');
        }

        function hideResetConfirm() {
            document.getElementById('resetOverlay').classList.remove('show');
        }

        async function confirmReset() {
            await resetTime(8);
            hideResetConfirm();
        }

        // App starten
        loadTime();

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
